[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-deploy-agent"
version = "0.2.0"
description = "Agentic planner for evidence-backed LLM inference deployments"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
deploy-agent = "deploy_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deploy_agent*"]

[tool.setuptools.package-data]
"deploy_agent" = ["data/licenses/*"]
